# Lantern Tickets verifier (agent-vc-poc). Based on walt.id v1.1.1 docker-compose/verifier-api2/config.
# Changed: clientId, clientMetadata, urlPrefix, key and x5c (see docs/WIRING.md, "Verification").

# Signed request objects (signed_request=true per session) with an x509_san_dns client id.
# The SAN of the x5c leaf below is tickets.localtest.me.
clientId: "x509_san_dns:tickets.localtest.me"

clientMetadata: {
   client_name: "Lantern Tickets"
}

# Wallet-facing request_uri / response_uri. Caddy routes only .../{id}/request and .../{id}/response
# on tickets.localtest.me to this service.
urlPrefix: "https://tickets.localtest.me/verification-session"

urlHost: "openid4vp://authorize"

# Request-signing key: the orchestrator's verifier key, included from the read-only /certs mount
# so the private key never lands in this folder.
key: {
  type: "jwk"
  jwk: {
    include file("/certs/verifier-signing.jwk.json")
  }
}

# Public leaf only (SAN tickets.localtest.me); it chains to infra/certs/rootCA.pem.
# BEGIN verifier x5c (generated by infra/waltid/sync-certs.mjs from infra/certs/verifier-signing.pem)
x5c: [""]
# END verifier x5c
