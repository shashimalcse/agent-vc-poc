# Agent Registry issuer metadata (agent-vc-poc). Replaces walt.id's demo catalogue with
# one configuration, AgentCredential (see docs/WIRING.md, "The agent credential").
issuerDisplay = [
  {
    name = "Agent Registry"
    locale = "en"
  }
]

credentialConfigurations = {
  "AgentCredential" = {
    format = "dc+sd-jwt"
    scope = "AgentCredential"
    vct = "https://registry.localtest.me/credentials/agent/v1"
    credential_signing_alg_values_supported = ["ES256"]
    cryptographic_binding_methods_supported = ["jwk"]
    proof_types_supported = {
      jwt = { proof_signing_alg_values_supported = ["ES256"] }
    }
    credential_metadata = {
      display = [{
        name = "Agent credential"
        locale = "en"
        description = "Accredited personal agent, issued by the Agent Registry"
        background_color = "#1F3A5F"
        text_color = "#FFFFFF"
      }]
      claims = [
        { path = ["agent_id"], display = [{ name = "Agent ID", locale = "en" }] },
        { path = ["agent_name"], display = [{ name = "Agent name", locale = "en" }] },
        { path = ["provider"], display = [{ name = "Provider", locale = "en" }] },
        { path = ["operator"], display = [{ name = "Operator", locale = "en" }] },
        { path = ["accreditation_level"], display = [{ name = "Accreditation level", locale = "en" }] }
      ]
    }
  }
}
