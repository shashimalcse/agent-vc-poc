# Agent Registry credential profile (agent-vc-poc). Replaces walt.id's demo profiles.
#
# Signing key: the orchestrator's issuer key, included from the read-only /certs mount so the
# private key never lands in this folder. x5c: the public leaf (SAN issuer.localtest.me),
# which chains to infra/certs/rootCA.pem. The trust anchor itself is not embedded.
agentIssuerKey = {
  type = "jwk"
  jwk = {
    include file("/certs/issuer-signing.jwk.json")
  }
}

