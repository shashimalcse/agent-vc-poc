profiles = {
  # Profile id equals the configuration id. The portal supplies the real claim values per offer
  # through runtimeOverrides.credentialData; the values below are placeholders only.
  AgentCredential = {
    name = "Agent credential"
    credentialConfigurationId = "AgentCredential"
    issuerKey = ${agentIssuerKey}
    issuerDid = null
    credentialData = {
      agent_id = "agt_placeholder"
      agent_name = "Placeholder agent"
      provider = "Other"
      operator = "Placeholder operator"
      accreditation_level = "basic"
    }
    mapping = {
      iat = "<timestamp-seconds>"
      nbf = "<timestamp-seconds>"
      exp = "<timestamp-in-seconds:90d>"
    }
    selectiveDisclosure = {
      fields = {
        agent_id = { sd = false }
        agent_name = { sd = true }
        provider = { sd = true }
        operator = { sd = true }
        accreditation_level = { sd = true }
      }
      decoyMode = "NONE"
      decoys = 0
    }
    x5Chain = ${agentIssuerX5chain}
  }
}
