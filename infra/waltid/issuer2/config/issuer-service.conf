# Agent Registry issuer (agent-vc-poc). Based on walt.id v1.1.1 docker-compose/issuer-api2/config.
# Changed: baseUrl is the public Caddy host. issuer2 appends /openid4vci, so the
# credential_issuer identifier (and the SD-JWT `iss`) is https://issuer.localtest.me/openid4vci.
baseUrl = "https://issuer.localtest.me"

# Unchanged walt.id demo token-signing key (signs issuer2 access tokens only, not credentials).
# Dev only: it is published in the walt.id repository.
ciTokenKey = """{"type":"jwk","jwk":{"kty":"EC","d":"KJ4k3Vcl5Sj9Mfq4rrNXBm2MoPoY3_Ak_PIR_EgsFhQ","crv":"P-256","x":"G0RINBiF-oQUD3d5DGnegQuXenI29JDaMGoMvioKRBM","y":"ed3eFGs2pEtrp7vAZ7BLcbrUtpKkYWAT2JPUQK4lN4E"}}"""

# Added: allow the pre-authorized code grant without a client_id (OpenID4VCI 1.0 "anonymous
# access"). Without this, issuer2 1.1.1 answers a token request that omits client_id with
# 401 invalid_client "Anonymous pre-authorized code access is not supported".
clientAuthenticationConfig {
  supportedMethods = [
    { type = "preauth-anonymous" }
  ]
}
